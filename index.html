<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>河川清掃船 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-sky-950 text-white select-none overflow-hidden">
  <canvas id="game-canvas"></canvas>

  <!-- HUD レイヤー -->
  <div id="hud-layer" class="fixed inset-0 pointer-events-none flex flex-col justify-between p-3 sm:p-4 z-10">
    <!-- 上部ステータスバー -->
    <div class="flex flex-col gap-2">
      <div class="flex items-start justify-between gap-2">
        <!-- 左上：船体耐久 ＋ 種類別ごみ回収数のみ -->
        <div class="flex flex-col gap-1.5 pointer-events-auto">
          <div class="bg-slate-900/80 backdrop-blur-md border border-white/15 rounded-2xl px-3.5 py-2 shadow-lg min-w-[165px]">
            <div class="flex items-center justify-between text-[11px] font-bold text-slate-300 mb-1">
              <span>船体耐久</span>
              <span id="hull-hp-text" class="text-emerald-300">100 / 100</span>
            </div>
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden border border-white/10">
              <div id="hull-hp-bar" class="h-full bg-emerald-400 transition-all duration-150" style="width: 100%;"></div>
            </div>
          </div>

          <!-- ごみ種類ごとの回収数リスト（合計カウントなし） -->
          <div id="hud-type-counts" class="bg-slate-900/80 backdrop-blur-md border border-white/15 rounded-2xl px-3 py-2 shadow-lg grid grid-cols-2 gap-x-3 gap-y-1 text-xs">
            <!-- ui.js により動的生成 -->
          </div>
        </div>

        <!-- 右上：残り時間 ＋ 設定ボタン -->
        <div class="flex items-center gap-2 pointer-events-auto">
          <div class="bg-slate-900/80 backdrop-blur-md border border-white/15 rounded-2xl px-3.5 py-2 shadow-lg text-right">
            <div class="text-[10px] font-bold tracking-wider text-amber-300 uppercase">残り時間</div>
            <div class="text-2xl font-black leading-none mt-0.5 tabular-nums">
              <span id="timer-display">60</span><span class="text-xs font-bold text-slate-300 ml-0.5">秒</span>
            </div>
          </div>

          <button id="settings-toggle-btn" type="button" aria-label="設定"
            class="bg-slate-900/80 hover:bg-slate-800 active:scale-95 backdrop-blur-md border border-white/15 rounded-2xl p-3 shadow-lg text-lg transition">
            ⚙️
          </button>
        </div>
      </div>

      <!-- 設定ドロワー（船員配置・川の流れ速度） -->
      <div id="settings-drawer" class="hidden self-end pointer-events-auto bg-slate-900/90 backdrop-blur-md border border-white/15 rounded-2xl p-3.5 shadow-xl w-64 text-xs">
        <div class="flex items-center justify-between mb-2.5">
          <span class="font-bold text-slate-200">船員（タモ網回収）</span>
          <label class="inline-flex items-center cursor-pointer">
            <input id="crew-toggle" type="checkbox" class="sr-only peer" />
            <div class="w-9 h-5 bg-slate-700 peer-checked:bg-sky-500 rounded-full relative transition">
              <span class="dot absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full transition"></span>
            </div>
          </label>
        </div>

        <div id="crew-count-row" class="hidden items-center justify-between mb-2.5 pt-2 border-t border-white/10">
          <span class="text-slate-300">配置人数</span>
          <div class="flex gap-1.5">
            <button type="button" data-crew-num="1" class="crew-num-btn px-2.5 py-1 rounded-lg bg-sky-500 text-white font-bold">1人</button>
            <button type="button" data-crew-num="2" class="crew-num-btn px-2.5 py-1 rounded-lg bg-slate-700 text-slate-200 font-bold">2人</button>
          </div>
        </div>

        <div class="pt-2 border-t border-white/10">
          <div class="flex justify-between text-slate-300 mb-1">
            <span>川の流れ速度</span>
            <span id="speed-value-label" class="font-bold text-sky-300">4.5</span>
          </div>
          <input id="river-speed-slider" type="range" min="2.0" max="9.0" step="0.5" value="4.5" class="w-full accent-sky-400" />
        </div>
      </div>
    </div>

    <!-- 下部操作ガイド -->
    <div class="flex justify-center">
      <div id="guide-pill" class="bg-slate-900/75 backdrop-blur-md border border-white/15 rounded-full px-4 py-1.5 text-xs font-medium text-slate-100 shadow-lg text-center">
        船を左右スワイプで操船して船首コンベアでゴミを回収しよう！
      </div>
    </div>
  </div>

  <!-- タイトルモーダル -->
  <div id="title-modal" class="fixed inset-0 z-20 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
    <div class="bg-slate-900/95 border border-white/15 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
      <div class="inline-block px-3 py-1 rounded-full bg-sky-500/20 border border-sky-400/30 text-sky-300 text-xs font-bold mb-2">
        RIVER CLEANUP 3D
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white mb-2">河川清掃船 3D</h1>
      <p class="text-xs text-slate-300 leading-relaxed mb-4">
        左右スワイプで清掃船を操船し、川に浮かぶ種類ごとのごみを回収しよう。<br />
        急旋回で傾きすぎると転覆や船員落水が発生します！
      </p>

      <div class="bg-slate-800/80 rounded-2xl p-3 mb-5 text-left text-xs text-slate-200 space-y-1.5 border border-white/10">
        <div>🚤 <strong>操船：</strong>画面を左右にスワイプ</div>
        <div>⚠️ <strong>注意：</strong>40°傾くと船員落水・50°超で転覆</div>
        <div>🧱 <strong>障害物：</strong>護岸や橋脚にぶつかると船体ダメージ</div>
      </div>

      <button id="start-btn" type="button"
        class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-teal-400 hover:from-sky-400 hover:to-teal-300 active:scale-98 text-slate-950 font-black text-base shadow-lg shadow-sky-500/25 transition">
        出航する
      </button>
    </div>
  </div>

  <!-- リザルトモーダル（合計数・ABC評価なし、種類別回収数のみ表示） -->
  <div id="result-modal" class="hidden fixed inset-0 z-20 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
    <div class="bg-slate-900/95 border border-white/15 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
      <div id="result-reason-badge" class="inline-block px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-xs font-bold mb-2">
        業務終了
      </div>
      <h2 id="result-title" class="text-2xl font-black text-white mb-1">清掃リザルト</h2>
      <p id="result-subtitle" class="text-xs text-slate-300 mb-4">種類ごとのごみ回収実績</p>

      <!-- ごみ種類ごとの回収数一覧 -->
      <div id="result-type-breakdown" class="bg-slate-800/80 border border-white/10 rounded-2xl p-3.5 mb-5 space-y-2 text-left">
        <!-- ui.js により動的生成 -->
      </div>

      <button id="retry-btn" type="button"
        class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-teal-400 hover:from-sky-400 hover:to-teal-300 active:scale-98 text-slate-950 font-black text-base shadow-lg shadow-sky-500/25 transition">
        もう一度出航する
      </button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ship.js"></script>
  <script src="js/trash.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
